# Instance unload delay (for extraction mechanics)
Instance.UnloadDelay = 1800000

# Instance access requirements (for tier gating)
Instance.IgnoreLevel = 0
Instance.IgnoreRaid = 0

# Account instances per hour (limit instance hopping)
AccountInstancesPerHour = 5

