###################################################################################################
# EXPERIENCE SYSTEM
# Mortal uses classless, skill-based progression - NO XP
###################################################################################################

# Disable all XP gains (classless system)
Rate.XP.Kill      = 0
Rate.XP.Quest     = 0
Rate.XP.Quest.DF  = 0
Rate.XP.Explore   = 0
Rate.XP.Pet       = 0

# Disable battleground XP
Rate.XP.BattlegroundKillAV   = 0
Rate.XP.BattlegroundKillWSG  = 0
Rate.XP.BattlegroundKillAB   = 0
Rate.XP.BattlegroundKillEOTS = 0
Rate.XP.BattlegroundKillSOTA = 0
Rate.XP.BattlegroundKillIC   = 0

###################################################################################################
# STATS SYSTEM
# Mortal stat caps: 150 per attribute, 400 total
###################################################################################################

# Enable stat limits (Mortal stat caps)
Stats.Limits.Enable = 1

# Set stat caps (Note: AzerothCore uses percentage caps, we'll enforce 150/400 in C++)
# These are set to 95% as AzerothCore default - actual 150/400 caps enforced in C++
Stats.Limits.Dodge = 95.0
Stats.Limits.Parry = 95.0
Stats.Limits.Block = 95.0
Stats.Limits.Crit  = 95.0

# Save stats to database for telemetry
PlayerSave.Stats.MinLevel = 1
PlayerSave.Stats.SaveOnlyOnLogout = 1

###################################################################################################
# CREATURE SCALING
# Map Mortal tiers (M-T1 to M-T5) to AzerothCore creature ranks
# Values are relative multipliers for damage/HP scaling
###################################################################################################

# Normal creatures (M-T1: Early content)
Rate.Creature.Normal.Damage          = 0.25
Rate.Creature.Normal.SpellDamage     = 0.25
Rate.Creature.Normal.HP              = 0.25

# Elite creatures (M-T2: Mid-tier content)
Rate.Creature.Elite.Elite.Damage     = 0.30
Rate.Creature.Elite.Elite.SpellDamage = 0.30
Rate.Creature.Elite.Elite.HP          = 0.30

# Rare creatures (M-T3: High-tier content)
Rate.Creature.Elite.RARE.Damage      = 0.40
Rate.Creature.Elite.RARE.SpellDamage = 0.40
Rate.Creature.Elite.RARE.HP          = 0.40

# Rare Elite creatures (M-T4: Raid-tier content)
Rate.Creature.Elite.RAREELITE.Damage = 0.50
Rate.Creature.Elite.RAREELITE.SpellDamage = 0.50
Rate.Creature.Elite.RAREELITE.HP     = 0.50

# World Boss creatures (M-T5: Endgame content)
Rate.Creature.Elite.WORLDBOSS.Damage = 0.55
Rate.Creature.Elite.WORLDBOSS.SpellDamage = 0.55
Rate.Creature.Elite.WORLDBOSS.HP     = 0.55

# Creature aggro radius (tunable for risk zones)
Rate.Creature.Aggro = 1.0

###################################################################################################
# DURABILITY SYSTEM
# Zone-based durability loss on death
###################################################################################################

# Durability loss on death (Green zones - low risk)
DurabilityLoss.OnDeath = 10

# Durability loss in PvP (Yellow zones - medium risk)
# Note: Red zones handled by custom code for full loot
DurabilityLoss.InPvP = 1

# Durability loss from damage (tunable)
DurabilityLossChance.Damage = 0.5
DurabilityLossChance.Absorb = 0.5
DurabilityLossChance.Parry = 0.05
DurabilityLossChance.Block = 0.05

###################################################################################################
# DEATH SYSTEM
# Corpse decay for extraction raids and zone-based mechanics
###################################################################################################

# Death sickness (disabled - we use Shrine system instead)
Death.SicknessLevel = 81

# Corpse reclaim delays (zone-based)
Death.CorpseReclaimDelay.PvP = 1
Death.CorpseReclaimDelay.PvE = 1

# Corpse decay times (for extraction raid mechanics)
# Normal creatures: 5 minutes (300 seconds)
Corpse.Decay.NORMAL = 300

# Rare creatures: 5 minutes
Corpse.Decay.RARE = 300

# Elite creatures: 5 minutes
Corpse.Decay.ELITE = 300

# Rare Elite creatures: 10 minutes (600 seconds)
Corpse.Decay.RAREELITE = 600

# World Boss creatures: 1 hour (3600 seconds)
Corpse.Decay.WORLDBOSS = 3600

# Corpse decay multiplier after looting (half time)
Rate.Corpse.Decay.Looted = 0.5

# Corpse bones (enabled for world, disabled for BGs/Arenas)
Death.Bones.World = 1
Death.Bones.BattlegroundOrArena = 0

###################################################################################################
# SKILL SYSTEM
# Skill gain rates for Mortal's skill-based progression
###################################################################################################

# Skill gain rates (tunable for skill progression speed)
SkillGain.Crafting  = 1.0
SkillGain.Defense   = 1.0
SkillGain.Gathering = 1.0
SkillGain.Weapon    = 1.0

# Skill discovery rate
Rate.Skill.Discovery = 1.0

# Skill gain chance by recipe color (for material lore system)
SkillChance.Orange = 100
SkillChance.Yellow = 75
SkillChance.Green  = 25
SkillChance.Grey   = 0

# Disable auto-max skills (we use skill-based progression)
AlwaysMaxSkillForLevel = 0
AlwaysMaxWeaponSkill = 0

###################################################################################################
# VISIBILITY AND DISTANCES
# Fog-of-war and Red Zone restrictions
###################################################################################################

# Visibility distances (tunable for Red Zone fog-of-war)
Visibility.Distance.Continents = 100
